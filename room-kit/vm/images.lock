# to $VM_ROOT/images/IMAGE_FILE and refuses it unless its sha256 is IMAGE_SHA256.
# vm-ctl.sh create checks the same digest before it makes a disk on top of it.
# Source of the digest: the release's SHA256SUMS on cloud-images.ubuntu.com.

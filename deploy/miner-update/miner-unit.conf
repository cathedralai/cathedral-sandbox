# Drop-in for the miner's systemd unit, shipped in every signed release.
#
# The bootstrap links <miner unit>.d/50-cathedral-miner-update.conf to
# /usr/local/lib/cathedral-miner-update/miner/current/unit.conf. When a release
# is active, that is this file: the miner runs the launcher from the release,
# and loads the release's image pin, network and netuid after the operator's
# own EnvironmentFile, so they win without editing it. Flipping miner/current
# switches the launcher, the pin and these settings with one rename.
[Service]
ExecStart=
ExecStart=/usr/local/lib/cathedral-miner-update/miner/current/launcher
EnvironmentFile=/usr/local/lib/cathedral-miner-update/miner/current/release.env

name: Leak guard

# Blocks host addresses, secrets, supplier names and customer names from
# this public repository. See "Public leak guard" in README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: leak-guard-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  scan:
    name: Leak guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Find the commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse "$head^")"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      # The secret is not available on a pull request from a fork. The script
      # then skips the private rules and writes a notice. It never prints a
      # private term.
      - name: Scan added lines, PR text and commit messages
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: >
          python scripts/leak_guard.py
          --base "${{ steps.range.outputs.base }}"
          --head "${{ steps.range.outputs.head }}"
          --event "$GITHUB_EVENT_PATH"

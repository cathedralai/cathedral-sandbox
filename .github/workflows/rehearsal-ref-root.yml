name: Rehearsal test root for reference initrd v1

# REHEARSAL-ONLY (AB#1008, run 6 preparation). Builds the root disk of the test image that
# boots reference initrd v1: ops/custom-guest/rehearsal-image/build-ref-root.sh with the
# cathedral-attest of reference-build run 46063612613 (#808). GitHub-hosted only.

on:
  pull_request:
    paths:
      - "ops/custom-guest/rehearsal-image/build-ref-root.sh"
      - "scripts/build_custom_guest_root.py"
      - ".github/workflows/rehearsal-ref-root.yml"

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  root:
    name: Rehearsal root for reference initrd v1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reference-build
          run-id: 46063612613
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/reference
      - name: Build the root (reference root recipe, twice, identical)
        run: bash ops/custom-guest/rehearsal-image/build-ref-root.sh "$RUNNER_TEMP/reference/cathedral-attest" "$RUNNER_TEMP/ref-root"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-ref-root
          path: ${{ runner.temp }}/ref-root/
          if-no-files-found: error

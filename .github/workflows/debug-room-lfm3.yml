name: Debug room LFM3 image (temporary)

on:
  push:
    branches:
      - eng/room-lfm3-image
    paths:
      - .github/workflows/debug-room-lfm3.yml

permissions:
  contents: read
  packages: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe CPU and every variant
        shell: bash
        run: |
          IMAGE=ghcr.io/cathedralai/room-lfm3-1.7b@sha256:6767a53dd2fd003d19913d74ea63e9ab57f63ac1b4bc41b19bcd20c424633f09
          docker run --rm "$IMAGE" bash -c '
            grep -m1 "model name" /proc/cpuinfo
            grep -m1 flags /proc/cpuinfo | tr " " "\n" | grep -E "^(avx|fma|bmi|f16c|sse4|amx)" | tr "\n" " "; echo
            ls -la /opt/llama/bin
            /opt/llama/bin/llama-cli --version -lv 4 2>&1 | head -40
            for lib in /opt/llama/bin/libggml-cpu-*.so; do
              v=$(basename "$lib" .so); v=${v#libggml-cpu-}
              d=/tmp/v/$v; mkdir -p "$d"; cp -a /opt/llama/bin/. "$d"/
              for other in "$d"/libggml-cpu-*.so; do [ "$(basename "$other")" = "libggml-cpu-$v.so" ] || rm -f "$other"; done
              echo "=== variant $v"
              LFM3_LLAMA_CLI="$d/llama-cli" LFM3_MAX_TOKENS=16 timeout 120 lfm3-ask "Say hi." 2>&1 | tail -3 | cut -c1-220
            done
          '

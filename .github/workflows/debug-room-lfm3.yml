name: Debug room LFM3 image (temporary)

on:
  push:
    branches:
      - eng/room-lfm3-image
    paths:
      - .github/workflows/debug-room-lfm3.yml

permissions:
  contents: read
  packages: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe CPU and every variant
        shell: bash
        run: |
          IMAGE=ghcr.io/cathedralai/room-lfm3-1.7b@sha256:6767a53dd2fd003d19913d74ea63e9ab57f63ac1b4bc41b19bcd20c424633f09
          docker run --rm "$IMAGE" bash -c '
            echo "=== devices (all variants present)"
            /opt/llama/bin/llama-cli --list-devices -lv 4 2>&1 | grep -i "backend\|device\|cpu" | head -20
            echo "=== gdb"
            apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq gdb >/dev/null 2>&1
            gdb -batch -ex run -ex bt -ex "x/3i \$pc" -ex "info sharedlibrary" --args /opt/llama/bin/llama-cli -m /opt/lfm3/LFM3-1.7B-Q4_K_M.gguf -p "Say hi." -st -n 8 -t 2 -c 512 --temp 0 --simple-io --reasoning off </dev/null 2>&1 | grep -v "^\[New Thread\|^\[Thread" | tail -45 | cut -c1-240
          '

name: Debug room LFM3 image (temporary)

on:
  push:
    branches:
      - eng/room-lfm3-image
    paths:
      - .github/workflows/debug-room-lfm3.yml

permissions:
  contents: read
  packages: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Probe CPU and every variant
        shell: bash
        run: |
          IMAGE=ghcr.io/cathedralai/room-lfm3-1.7b@sha256:6767a53dd2fd003d19913d74ea63e9ab57f63ac1b4bc41b19bcd20c424633f09
          docker run --rm "$IMAGE" bash -c '
            echo "CPU: $(grep -m1 "model name" /proc/cpuinfo)"
            echo "FLAGS: $(grep -m1 flags /proc/cpuinfo | tr " " "\n" | grep -E "^(avx512|avx_vnni|amx)" | tr "\n" " ")"
            echo "=== all variants"
            lfm3-ask "Say hi." 2>&1 | tail -2 | cut -c1-200
            for lib in /opt/llama/bin/libggml-cpu-*.so; do
              v=$(basename "$lib" .so); v=${v#libggml-cpu-}
              d=/tmp/v/$v; mkdir -p "$d"; cp -a /opt/llama/bin/. "$d"/
              for other in "$d"/libggml-cpu-*.so; do [ "$(basename "$other")" = "libggml-cpu-$v.so" ] || rm -f "$other"; done
              r=$(LFM3_LLAMA_CLI="$d/llama-cli" LFM3_MAX_TOKENS=8 timeout 120 lfm3-ask "Say hi." 2>&1 | tail -3 | tr "\n" " " | cut -c1-160)
              echo "variant $v: $r"
            done
          '

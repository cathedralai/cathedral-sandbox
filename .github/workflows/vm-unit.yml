name: VM unit

# The generated customer VM unit under a real systemd, with stubs in place of QEMU, the gates and the link
# (tests/test_vm_unit_systemd.py). It catches what the fake systemctl of the other VM tests cannot: what a `+` hook
# sees inside the unit's mount namespace (the live VM proof's check-paid refusal, 28 Nov).

on:
  push:
    branches: [main]
    paths:
      - "room-kit/vm/**"
      - "tests/test_vm_unit_systemd.py"
      - ".github/workflows/vm-unit.yml"
  pull_request:
    paths:
      - "room-kit/vm/**"
      - "tests/test_vm_unit_systemd.py"
      - ".github/workflows/vm-unit.yml"

concurrency:
  group: vm-unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Generated VM unit under real systemd (root, ${{ matrix.os }})
    # 26.04 ships systemd 259, the version of the host where the live VM proof failed; 24.04 has 255. The unwrapped unit fails on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Versions
        run: |
          systemctl --version | head -2
          cat /etc/os-release | head -3
          nsenter --version
          python3 --version
      - name: Test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q pytest
      - name: Run the unit test as root
        run: sudo env VM_SYSTEMD_TESTS=1 "$RUNNER_TEMP/venv/bin/python" -m pytest -v -s tests/test_vm_unit_systemd.py
      - name: Journal on failure
        if: failure()
        run: sudo journalctl --no-pager -n 160 -o cat || true

name: Publish SN39 audit-miner image

on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/workflows/publish-sn39-audit-miner.yml
      - Dockerfile.sn39-audit-miner
      - cathedral/**
      - requirements/sn39-audit-miner.txt
      - scripts/run_sn39_signed_fleet_miner.sh
  workflow_dispatch:
    inputs:
      image_digest:
        description: Immutable sha256 digest to verify after GHCR visibility is public
        required: true
        type: string

permissions: {}

env:
  IMAGE_PATH: ghcr.io/cathedralai/cathedral-sn39-audit-miner

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: sn39-audit-miner-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      commit_tag: ${{ steps.image.outputs.commit_tag }}
      digest: ${{ steps.pin.outputs.digest }}
      image_ref: ${{ steps.pin.outputs.image_ref }}
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the immutable source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: >-
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the commit tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          commit_tag="sha-${GITHUB_SHA}"
          tag_ref="${IMAGE_PATH}:${commit_tag}"
          echo "commit_tag=${commit_tag}" >> "$GITHUB_OUTPUT"
          echo "tag_ref=${tag_ref}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite the commit tag
        shell: bash
        env:
          TAG_REF: ${{ steps.image.outputs.tag_ref }}
        run: |
          set -euo pipefail
          set +e
          inspection="$(docker buildx imagetools inspect "$TAG_REF" 2>&1)"
          inspection_status=$?
          set -e
          if [[ $inspection_status -eq 0 ]]; then
            echo "::error::Immutable image tag already exists: $TAG_REF"
            exit 1
          fi
          if grep -Eiq 'manifest unknown|not found' <<< "$inspection"; then
            exit 0
          fi
          echo "::error::Could not prove the immutable image tag is unused"
          printf '%s\n' "$inspection"
          exit 1

      - name: Build and publish linux/amd64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.sn39-audit-miner
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.image.outputs.tag_ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max

      - name: Capture the digest launch pin
        id: pin
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG_REF: ${{ steps.image.outputs.tag_ref }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE_PATH}@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          {
            echo "### SN39 audit-miner publication"
            echo
            echo "Commit tag: \`${TAG_REF}\`"
            echo
            echo "Validator and Polaris pin: \`${image_ref}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the published digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PATH }}
          subject-digest: ${{ steps.pin.outputs.digest }}
          push-to-registry: true

      - name: Log out of GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io

  verify-public:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: >-
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Verify anonymous digest access
        shell: bash
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_REF"
          echo "Anonymous GHCR access passed for \`${IMAGE_REF}\`." >> "$GITHUB_STEP_SUMMARY"

  verify-existing-public-digest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Validate the requested digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: >-
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Verify anonymous digest access
        shell: bash
        env:
          IMAGE_REF: ${{ env.IMAGE_PATH }}@${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_REF"
          echo "Anonymous GHCR access passed for \`${IMAGE_REF}\`." >> "$GITHUB_STEP_SUMMARY"

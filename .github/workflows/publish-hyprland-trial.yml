name: Build internal Hyprland trial image

on:
  pull_request:
    paths:
      - .github/workflows/publish-hyprland-trial.yml
      - images/hyprland-trial/**
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-hyprland-trial.yml
      - images/hyprland-trial/**

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1
          driver-opts: >-
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build linux/amd64 for review
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/hyprland-trial
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: hyprland-trial:check
      - name: Verify unprivileged image and installed tools
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /bin/sh hyprland-trial:check -ec '
            test "$(id -u)" = 10001
            command -v Hyprland
            command -v hyprctl
            command -v wayvnc
            command -v vncdo
            command -v foot
            test -x /usr/local/bin/hyprland-trial-probe
            Hyprland --version
          '
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-tagged image
        if: github.event_name == 'push'
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/hyprland-trial
          platforms: linux/amd64
          pull: true
          push: true
          tags: ghcr.io/cathedralai/hyprland-trial:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
      - name: Report immutable room pin
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "Internal trial pin: \`ghcr.io/cathedralai/hyprland-trial@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
